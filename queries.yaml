# queries.yaml: the example queries of the query page. Single source for
#   docs/sparql.html            the page (rdflib under Pyodide, no endpoint, no server)
#   docs/downloads/queries/*.rq the same queries as plain files
#   qmd/beaverbridge-registry-sparql-live.qmd   the quarto-live notebook (written, rendered only on request)
# Every query is run against the real bundle at build time. A query that returns no rows fails the build:
# SPARQL does not fail on a mistyped IRI, it returns nothing.

graph:
  file: dist/beaverbridge-registry.ttl            # checked at build time
  url: downloads/beaverbridge-registry.ttl         # how the page reaches it, relative to docs/
  publish: false                                   # step_site.py has already copied it there

page:
  title: "Query all instances"
  intro: >-
    The bundle of all registered instances is one RDF graph. The queries below run on it in your browser; edit
    them and press Run. Questions across instances go through the <code>bbr:</code> roles (instance of, subclass of,
    part of, …) and never through a P-number, because the numbers differ between Wikibases.
  vocabulary_note: >-
    vocabulary: <a href="vocab/index.html"><code>bbr:</code></a>.

qmd:
  file: beaverbridge-registry-sparql-live.qmd
  title: "Querying the BeaverBridge registry"
  graph_url: "https://beaverbridge-framework.github.io/beaverbridge-registry/downloads/beaverbridge-registry.ttl"
  about: >-
    This notebook queries the registry bundle, one RDF graph over several static Wikibase instances, with SPARQL in
    the browser. Nothing is sent to a server.
  notes: |
    The roles `bbr:instanceOf`, `bbr:subclassOf`, `bbr:partOf` and the others are the same in every instance, although
    the Wikibase properties behind them are not (`P1` and `P2` are swapped between fuzzy-sl and chublets). Ask across
    instances through the roles.

prefixes: |
  PREFIX bbr: <https://beaverbridge-framework.github.io/beaverbridge-registry/vocab/>
  PREFIX dcat: <http://www.w3.org/ns/dcat#>
  PREFIX dct: <http://purl.org/dc/terms/>
  PREFIX foaf: <http://xmlns.com/foaf/0.1/>
  PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX wikibase: <http://wikiba.se/ontology#>

queries:
  - id: instances
    title: "Which instances are in the registry?"
    intro: >-
      One catalogue record per instance: where it comes from, under which licence, written by which version of
      wikibase-static, and how large the export was before the registry kept what a search needs.
    sparql: |
      SELECT ?instance ?title ?licence ?generator ?dataAsOf ?sourceTriples WHERE {
        ?record a dcat:CatalogRecord ;
                bbr:prefix ?instance ;
                dct:title ?title ;
                bbr:sourceTripleCount ?sourceTriples .
        OPTIONAL { ?record bbr:generator ?generator }
        OPTIONAL { ?record dct:modified ?dataAsOf }
        OPTIONAL { ?record foaf:primaryTopic/dct:license ?licence }
      }
      ORDER BY ?instance

  - id: classes
    title: "Which classes have how many items?"
    intro: >-
      The same question in every instance, asked through <code>bbr:instanceOf</code>. The English label of the
      class is shown; some classes have a second label in another language.
    sparql: |
      SELECT ?instance ?class (COUNT(DISTINCT ?item) AS ?items) WHERE {
        ?item bbr:instanceOf ?c ;
              bbr:fromInstance/bbr:prefix ?instance .
        ?c rdfs:label ?class .
        FILTER(LANG(?class) = "en")
      }
      GROUP BY ?instance ?class
      ORDER BY ?instance DESC(?items) ?class

  - id: hierarchy
    title: "How are the classes related?"
    intro: >-
      Subclass links of all instances, through <code>bbr:subclassOf</code>. Each row is one link from a class to
      its superclass.
    sparql: |
      SELECT ?instance ?class ?superclass WHERE {
        ?c bbr:subclassOf ?s ;
           bbr:fromInstance/bbr:prefix ?instance ;
           rdfs:label ?class .
        ?s rdfs:label ?superclass .
        FILTER(LANG(?class) = "en" && LANG(?superclass) = "en")
      }
      ORDER BY ?instance ?superclass ?class

  - id: roles
    title: "Which Wikibase property stands behind a role?"
    intro: >-
      The registry writes every role as a normalised statement next to the source statement. Asking for the
      source predicate that carries the same object shows the crosswalk at work: <em>instance of</em> is
      <code>P1</code> in one instance and <code>P2</code> in the other.
    sparql: |
      SELECT DISTINCT ?instance (REPLACE(STR(?role), "^.*/", "bbr:") AS ?roleName) ?sourcePredicate WHERE {
        VALUES ?role { bbr:instanceOf bbr:subclassOf bbr:partOf bbr:externalMatch }
        ?s ?role ?o ;
           bbr:fromInstance/bbr:prefix ?instance ;
           ?sourcePredicate ?o .
        FILTER(?sourcePredicate != ?role)
      }
      ORDER BY ?roleName ?instance

  - id: class-kinds
    title: "Which classes describe the data model and which the subject?"
    intro: >-
      The registry marks every class as <em>domain</em> (the things the instance is about: sites, software) or
      <em>model</em> (vocabulary, types, provenance, the roots of the class tree). This is a statement of the
      registry, kept in <code>crosswalks/classes.csv</code>, not of the instances.
    sparql: |
      SELECT ?instance ?kind (COUNT(DISTINCT ?c) AS ?classes) (GROUP_CONCAT(DISTINCT ?label; separator=", ") AS ?examples) WHERE {
        ?c bbr:classKind ?kind ;
           bbr:fromInstance/bbr:prefix ?instance ;
           rdfs:label ?label .
        FILTER(LANG(?label) = "en")
      }
      GROUP BY ?instance ?kind
      ORDER BY ?instance ?kind

  - id: crm-anchors
    title: "Which classes carry a CIDOC CRM class of their own?"
    intro: >-
      <em>source</em> means the instance states the anchor itself, <em>bridge</em> that the registry states it
      because the instance does not. All other classes inherit the anchor of a superclass, see the next query.
    sparql: |
      SELECT ?instance ?class (REPLACE(STR(?crm), "^.*/", "") AS ?crmClass) ?basis WHERE {
        ?c bbr:crmClass ?crm ;
           bbr:crmBasis ?basis ;
           bbr:fromInstance/bbr:prefix ?instance ;
           rdfs:label ?class .
        FILTER(LANG(?class) = "en")
      }
      ORDER BY ?instance ?class

  - id: crm-reach
    title: "How many items sit under each CIDOC CRM class?"
    intro: >-
      The path <code>bbr:instanceOf/bbr:subclassOf*/bbr:crmClass</code> follows the subclass links up to the nearest
      anchor, so the question is the same in every instance although only some of them state anchors.
    sparql: |
      SELECT ?instance (REPLACE(STR(?crm), "^.*/", "") AS ?crmClass) (COUNT(DISTINCT ?item) AS ?items) WHERE {
        ?item bbr:instanceOf/bbr:subclassOf*/bbr:crmClass ?crm ;
              bbr:fromInstance/bbr:prefix ?instance .
      }
      GROUP BY ?instance ?crm
      ORDER BY ?instance DESC(?items)

  - id: coordinates
    title: "Which items have coordinates?"
    intro: >-
      Items with a position, as the source states it (WKT, longitude first). Only instances with a coordinate
      property show up.
    sparql: |
      SELECT ?instance ?item ?class ?coordinates WHERE {
        ?i bbr:coordinates ?coordinates ;
           bbr:fromInstance/bbr:prefix ?instance ;
           rdfs:label ?item .
        FILTER(LANG(?item) = "en")
        OPTIONAL {
          ?i bbr:instanceOf ?c .
          ?c rdfs:label ?class .
          FILTER(LANG(?class) = "en")
        }
      }
      ORDER BY ?instance ?item

  - id: wikidata
    title: "Which items point to Wikidata?"
    intro: >-
      Plain Q-numbers in the sources are turned into Wikidata IRIs by the bundle step, so this works the same for
      every instance.
    sparql: |
      SELECT ?instance ?item ?wikidata WHERE {
        ?i bbr:wikidataEquivalent ?wikidata ;
           bbr:fromInstance/bbr:prefix ?instance ;
           rdfs:label ?item .
        FILTER(LANG(?item) = "en")
      }
      ORDER BY ?instance ?item

  - id: match-hosts
    title: "Where do the external matches lead?"
    intro: >-
      Matches are grouped by the host of the URL they point to.
    sparql: |
      SELECT ?instance ?host (COUNT(?i) AS ?links) WHERE {
        ?i bbr:externalMatch ?url ;
           bbr:fromInstance/bbr:prefix ?instance .
        BIND(REPLACE(STR(?url), "^https?://([^/]+).*$", "$1") AS ?host)
      }
      GROUP BY ?instance ?host
      ORDER BY DESC(?links) ?host

  - id: properties
    title: "Which properties does each instance define?"
    intro: >-
      All properties with their datatype. The numbers are local to the instance; the label and datatype are what
      can be compared.
    sparql: |
      SELECT ?instance ?property ?label ?datatype WHERE {
        ?p a wikibase:Property ;
           rdfs:label ?label ;
           wikibase:propertyType ?t ;
           bbr:fromInstance/bbr:prefix ?instance .
        FILTER(LANG(?label) = "en")
        BIND(REPLACE(STR(?p), "^.*/", "") AS ?property)
        BIND(REPLACE(STR(?t), "^.*#", "") AS ?datatype)
      }
      ORDER BY ?instance ?datatype ?label

  - id: same-label
    title: "Which labels occur in more than one instance?"
    intro: >-
      Equal names are reported and never merged: the registry only states that two entries share a label, not that
      they are the same thing. Whether <em>Florian Thiery</em> in both instances is one person is for a person to
      say.
    sparql: |
      SELECT ?label ?a ?x ?b ?y WHERE {
        ?x rdfs:label ?label ;
           bbr:fromInstance/bbr:prefix ?a .
        ?y rdfs:label ?label ;
           bbr:fromInstance/bbr:prefix ?b .
        FILTER(?a < ?b && LANG(?label) = "en")
      }
      ORDER BY ?label
